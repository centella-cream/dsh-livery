name: release-candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build and inspect the real tarball
        run: pnpm pack:candidate
      - name: Upload candidate tarball + manifest
        uses: actions/upload-artifact@v4
        with:
          name: dsh-livery-candidate
          path: |
            .tmp/release-check/*.tgz
            .tmp/release-check/release-manifest.json

  release-gates:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      # The artifact is built from the tag commit, but the released matrix and
      # evidence live on the default branch (promotion happens after acceptance).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          path: .tmp/candidate
      - name: Verify the downloaded bytes (no rebuild)
        run: pnpm verify:artifact -- --tgz .tmp/candidate/dsh-livery-0.1.0.tgz
      - name: Bind candidate to acceptance evidence
        env:
          RELEASE_EVIDENCE: contracts/dsh/evidence/0.2.1-rc.2-web-chrome.json
        run: |
          if [ ! -f .tmp/candidate/release-manifest.json ]; then
            echo "release-manifest.json missing from candidate artifact" >&2
            exit 1
          fi
          if [ -n "${RELEASE_EVIDENCE:-}" ]; then
            pnpm verify:evidence -- --tgz .tmp/candidate/dsh-livery-0.1.0.tgz --evidence "$RELEASE_EVIDENCE"
          else
            echo "No acceptance evidence supplied; release evidence binding is required before promotion." >&2
            exit 1
          fi
      - name: Enforce every packaged adapter against the formal matrix
        run: |
          pnpm gate:support-matrix -- --all
          pnpm gate:release -- --all
      # Publishing is intentionally not automated here. A controlled release
      # downloads the exact candidate artifact above, binds it to acceptance
      # evidence, promotes the reviewed matrix entry, then re-runs both gates on
      # the same bytes before a separate publish job.
