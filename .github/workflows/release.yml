name: release-candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      # Evidence commits are older than the tag and must be reachable locally;
      # a shallow clone makes `git merge-base --is-ancestor` fail.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - id: meta
        name: Derive candidate name from package metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name.split('/').at(-1)")
          TARBALL="${NAME}-${VERSION}.tgz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag/version mismatch: v$VERSION vs $GITHUB_REF_NAME" >&2; exit 1; }
          fi
      - run: pnpm install --frozen-lockfile
      - name: Require the acceptance artifact run id BEFORE downloading
        run: |
          test -n "${{ vars.LIVERY_ACCEPTANCE_RUN_ID }}" || {
            echo "LIVERY_ACCEPTANCE_RUN_ID repository variable is required; tag workflow never rebuilds the candidate" >&2
            exit 1
          }
      - name: Assert the producer run was built from this exact tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ vars.LIVERY_ACCEPTANCE_RUN_ID }}"
          PRODUCER_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          test "$PRODUCER_SHA" = "$GITHUB_SHA" || {
            echo "producer run $RUN_ID headSha=$PRODUCER_SHA != tag commit $GITHUB_SHA" >&2
            exit 1
          }
      - name: Download the EXACT accepted candidate (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          run-id: ${{ vars.LIVERY_ACCEPTANCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .tmp/accepted
      - name: Assert the accepted tarball is the one bound by evidence
        run: |
          TGZ=$(find .tmp/accepted -maxdepth 1 -name '${{ steps.meta.outputs.tarball }}' -print -quit)
          test -n "$TGZ"
          cp "$TGZ" .tmp/accepted-candidate.tgz
          test -f .tmp/accepted/release-manifest.json
          cp .tmp/accepted/release-manifest.json .tmp/release-manifest.json
      - name: Validate downloaded manifest bytes/version/hash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MANIFEST=.tmp/release-manifest.json
          test -f "$MANIFEST"
          node - "$MANIFEST" "$VERSION" .tmp/accepted-candidate.tgz <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const [manifestPath, version, tgzPath] = process.argv.slice(2)
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          const digest = crypto.createHash('sha256').update(fs.readFileSync(tgzPath)).digest('hex')
          if (manifest.version !== version) throw new Error(`manifest version ${manifest.version} != ${version}`)
          if (manifest.sha256 !== digest) throw new Error(`manifest sha ${manifest.sha256} != ${digest}`)
          if (manifest.bytes !== fs.statSync(tgzPath).size) throw new Error('manifest bytes mismatch')
          NODE
      - name: Upload accepted candidate + manifest
        uses: actions/upload-artifact@v4
        with:
          name: dsh-livery-candidate
          path: |
            .tmp/accepted-candidate.tgz
            .tmp/release-manifest.json
          include-hidden-files: true

  release-gates:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      # The artifact is built from the tag commit, but the released matrix and
      # evidence live on the default branch (promotion happens after acceptance).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gate CLIs (no artifact rebuild)
        run: pnpm build:cli
      - name: Download the exact accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          path: .tmp/candidate
      - name: Resolve downloaded candidate
        run: |
          test -f .tmp/candidate/accepted-candidate.tgz
          mv .tmp/candidate/accepted-candidate.tgz .tmp/candidate/candidate.tgz
          TGZ=.tmp/candidate/candidate.tgz
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"
          VERSION=$(tar -xOzf "$TGZ" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag/version mismatch: v$VERSION vs $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Verify the downloaded bytes (no rebuild)
        run: pnpm verify:artifact -- --tgz "$TGZ"
      - name: Bind candidate to all formal-matrix evidence
        run: |
          test -f .tmp/candidate/release-manifest.json
          for evidence in $(node scripts/release-evidence-list.mjs); do
            pnpm verify:evidence -- --tgz "$TGZ" --evidence "$evidence"
          done
      - name: Enforce every packaged adapter against the formal matrix
        run: |
          pnpm gate:support-matrix -- --all
          pnpm gate:release -- --all

  publish:
    needs: release-gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build gate CLIs (no artifact rebuild)
        run: pnpm build:cli
      - name: Download the exact accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          path: .tmp/candidate
      - name: Resolve downloaded candidate
        run: |
          TGZ=$(find .tmp/candidate -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$TGZ"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"
          VERSION=$(tar -xOzf "$TGZ" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag/version mismatch: v$VERSION vs $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Verify the downloaded candidate against committed evidence
        run: |
          for evidence in $(node scripts/release-evidence-list.mjs); do
            pnpm verify:evidence -- --tgz "$TGZ" --evidence "$evidence"
          done
          pnpm gate:support-matrix -- --all
          pnpm gate:release -- --all
      - name: Pre-publish guard on the downloaded candidate
        run: node scripts/prepublish-check.mjs --tgz "$TGZ"
      - name: Publish the exact accepted tarball
        run: |
          export RELEASE_TGZ="$TGZ"
          npm publish "$TGZ" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  postpublish-verify:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Download the exact accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          path: .tmp/candidate
      - name: Wait for npm propagation and download the published tarball
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          FOUND=0
          for attempt in $(seq 1 30); do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then FOUND=1; break; fi
            sleep 10
          done
          test "$FOUND" = "1" || { echo "npm version $NAME@$VERSION did not propagate" >&2; exit 1; }
          mkdir -p .tmp/registry
          npm pack "$NAME@$VERSION" --pack-destination .tmp/registry
      - name: Compare registry bytes with the accepted candidate
        run: |
          TGZ=$(find .tmp/candidate -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$TGZ"
          REGISTRY=$(find .tmp/registry -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$REGISTRY"
          node scripts/verify-published.mjs --candidate "$TGZ" --registry "$REGISTRY"
      - name: Generate checksums and release manifest
        run: |
          TGZ=$(find .tmp/candidate -maxdepth 1 -name '*.tgz' -print -quit)
          cp .tmp/candidate/release-manifest.json release-manifest.json
          sha256sum "$TGZ" | sed 's# .*/# #' > SHA256SUMS
          cat SHA256SUMS
      - name: Attach accepted tarball, checksum and manifest to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TGZ=$(find .tmp/candidate -maxdepth 1 -name '*.tgz' -print -quit)
          VERSION=$(node -p "require('./package.json').version")
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "DSH Livery $VERSION" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$TGZ" SHA256SUMS release-manifest.json --clobber
