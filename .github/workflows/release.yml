name: release-candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build and inspect the real tarball
        run: pnpm pack:candidate
      - name: Upload candidate tarball + manifest
        uses: actions/upload-artifact@v4
        with:
          name: dsh-livery-candidate
          path: |
            .tmp/release-check/*.tgz
            .tmp/release-check/release-manifest.json

  release-gates:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce every packaged adapter against the formal matrix
        run: |
          pnpm gate:support-matrix -- --all
          pnpm gate:release -- --all
      # Publishing is intentionally not automated here. A controlled release
      # first downloads the exact candidate artifact above, binds it to
      # acceptance evidence, promotes the reviewed matrix entry, then re-runs
      # both gates on the same bytes before a separate publish job.
