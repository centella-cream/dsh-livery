name: release-candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      # Evidence commits are older than the tag and must be reachable locally;
      # a shallow clone makes `git merge-base --is-ancestor` fail.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build and inspect the real tarball
        run: pnpm pack:candidate
      - name: Upload candidate tarball + manifest
        uses: actions/upload-artifact@v4
        with:
          name: dsh-livery-candidate
          path: |
            .tmp/release-check/*.tgz
            .tmp/release-check/release-manifest.json

  release-gates:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      # The artifact is built from the tag commit, but the released matrix and
      # evidence live on the default branch (promotion happens after acceptance).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gate CLIs (no artifact rebuild)
        run: pnpm build:cli
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          path: .tmp/candidate
      - name: Verify the downloaded bytes (no rebuild)
        run: pnpm verify:artifact -- --tgz .tmp/candidate/dsh-livery-0.1.2.tgz
      - name: Bind candidate to acceptance evidence
        env:
          RELEASE_EVIDENCE: contracts/dsh/evidence/0.2.1-rc.2-web-chrome.json contracts/dsh/evidence/0.2.1-rc.3-desktop-macos.json
        run: |
          if [ ! -f .tmp/candidate/release-manifest.json ]; then
            echo "release-manifest.json missing from candidate artifact" >&2
            exit 1
          fi
          if [ -n "${RELEASE_EVIDENCE:-}" ]; then
            for evidence in $RELEASE_EVIDENCE; do
              pnpm verify:evidence -- --tgz .tmp/candidate/dsh-livery-0.1.2.tgz --evidence "$evidence"
            done
          else
            echo "No acceptance evidence supplied; release evidence binding is required before promotion." >&2
            exit 1
          fi
      - name: Enforce every packaged adapter against the formal matrix
        run: |
          pnpm gate:support-matrix -- --all
          pnpm gate:release -- --all
  publish:
    needs: release-gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build gate CLIs (no artifact rebuild)
        run: pnpm build:cli
      - name: Download the exact accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: dsh-livery-candidate
          path: .tmp/candidate
      - name: Verify the downloaded candidate against committed evidence
        run: |
          pnpm verify:evidence -- --tgz .tmp/candidate/dsh-livery-0.1.2.tgz --evidence contracts/dsh/evidence/0.2.1-rc.2-web-chrome.json
          pnpm verify:evidence -- --tgz .tmp/candidate/dsh-livery-0.1.2.tgz --evidence contracts/dsh/evidence/0.2.1-rc.3-desktop-macos.json
          pnpm gate:support-matrix -- --all
          pnpm gate:release -- --all
      - name: Publish the exact accepted tarball
        run: npm publish .tmp/candidate/dsh-livery-0.1.2.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
